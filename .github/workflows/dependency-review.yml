name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: moderate
          license-check: false
          # ws@8.17.1 (transitive: funkit -> fun-relay -> tronweb -> ethers@6.13.5).
          # Both advisories are server-side issues (DoS from tiny frames; uninitialized
          # memory disclosure); the interface only uses ws as a transitive client (the
          # browser uses native WebSocket). A scoped yarn resolution can't reach a dep
          # this deeply nested in yarn-classic, so allowlist these specific GHSAs.
          allow-ghsas: GHSA-96hv-2xvq-fx4p, GHSA-58qx-3vcg-4xpx
